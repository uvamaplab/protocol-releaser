name: Release Creation
description: Compresses images and videos and creates zip artifact for release

inputs:
  tag_name:
    description: 'The release tag'
    required: false
    type: string

  src_directory:
    description: 'The release directory'
    required: false
    type: string
    default: 'src'

  compress_videos:
    description: 'Re-encode .mp4 videos (at most 720p, H.264) to shrink the release'
    required: false
    default: 'true'

  reuse_media:
    description: 'Reuse images and videos already processed by an earlier release (from its media.zip) when their content is unchanged'
    required: false
    default: 'true'

runs:
  using: "composite"
  steps:
    # This step was added due to git not supporting capitalization control. It runs before
    # resizing so that upper-case extensions (.JPG, .PNG, ...) are matched by the resize step.
    - name: Rename all directories and files to lowercase
      run: |
        time find ./${{ inputs.src_directory }}/* -depth -name "*[A-Z]*" -print0 | while IFS= read -r -d '' path; do
          lower="${path%/*}/$(printf '%s' "${path##*/}" | tr 'A-Z' 'a-z')"
          if [ -e "$lower" ]; then echo "Not renamed, $lower already exists: $path"; else mv "$path" "$lower"; fi
        done
      shell: bash

    # Lists the images over 100 KiB and the videos to process, with a hash of each one's content.
    # Any that the newest earlier release with a media.zip (built by this same action.yml) already
    # processed are copied from that media.zip instead, so unchanged media is not processed again.
    - name: Reuse media processed by an earlier release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        work="$RUNNER_TEMP/protocol-releaser"
        rm -rf "$work" && mkdir -p "$work/cache"
        settings=$(sha256sum "$GITHUB_ACTION_PATH/action.yml" | cut -d' ' -f1)
        echo "$settings" > "$work/settings"

        find ./${{ inputs.src_directory }}/* -type f \( -name '*.jpeg' -o -name '*.jpg' -o -name '*.png' -o -name '*.gif' \) -size +100k -print0 > "$work/candidates"
        if [ "${{ inputs.compress_videos }}" = true ]; then find ./${{ inputs.src_directory }}/* -type f -name '*.mp4' -print0 >> "$work/candidates"; fi
        time xargs -0 -r -P 4 -n 64 sha256sum < "$work/candidates" > "$work/hashes"

        declare -A cached
        if [ "${{ inputs.reuse_media }}" = true ]; then
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" \
            --jq '[.[] | select(.draft | not) | select(any(.assets[]; .name == "media.zip"))][0].tag_name // empty' || true)
          if [ -n "$tag" ] \
            && gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern media.zip --dir "$work/previous" \
            && unzip -q "$work/previous/media.zip" -d "$work/cache" \
            && [ "$(head -n 1 "$work/cache/media-cache.tsv" | cut -f 2)" = "$settings" ]; then
            while IFS=$'\t' read -r hash file; do
              if [[ "$file" != *..* ]] && [ -f "$work/cache/$file" ]; then cached[$hash]=$file; fi
            done < <(tail -n +2 "$work/cache/media-cache.tsv")
            echo "Using media.zip from release $tag"
          else
            echo "No usable media.zip from an earlier release${tag:+ (newest: $tag)}, so all media will be processed"
          fi
        fi

        : > "$work/plan"; : > "$work/todo-images"; : > "$work/todo-videos"
        reused=0
        while read -r hash path; do
          printf '%s\t%s\n' "$hash" "$path" >> "$work/plan"
          if [ -n "${cached[$hash]:-}" ]; then
            cp "$work/cache/${cached[$hash]}" "$path"
            reused=$((reused + 1))
          elif [[ "$path" == *.mp4 ]]; then
            echo "$path" >> "$work/todo-videos"
          else
            echo "$path" >> "$work/todo-images"
          fi
        done < "$work/hashes"
        echo "$(wc -l < "$work/plan") media files: $reused reused, $(wc -l < "$work/todo-images") images and $(wc -l < "$work/todo-videos") videos to process"
      shell: bash

    - name: Install tools
      run: |
        work="$RUNNER_TEMP/protocol-releaser"
        packages=()
        if [ -s "$work/todo-images" ]; then packages+=(libvips-tools libjpeg-turbo8); fi
        if [ -s "$work/todo-videos" ]; then packages+=(ffmpeg); fi
        if [ ${#packages[@]} -eq 0 ]; then echo "Nothing to process, so nothing to install"; exit 0; fi
        time ( \
          sudo apt update; \
          sudo apt install -y "${packages[@]}"; \
        )
      shell: bash

    # The '>' in --size means only shrink, never enlarge. parallel -X gives each vipsthumbnail
    # a batch of files (startup is paid per batch, not per file); each output is written next to
    # its input as __resized__<name>, then renamed over it. parallel runs the command through a
    # shell, so it needs the inner quotes.
    # .jpeg/.jpg files are saved as WebP but keep their names, so references in the protocol JSON
    # still work: the app's image decoders (Android 10+, iOS 15+) detect the format from the content.
    # WebP Q75 was about 30% smaller than JPEG Q70 and scored higher on SSIM for leia's images.
    - name: Resize images to optimized thumbnails
      run: |
        work="$RUNNER_TEMP/protocol-releaser"
        if [ ! -s "$work/todo-images" ]; then echo "No images to resize"; exit 0; fi
        time ( \
          awk '/\.jpeg$/' "$work/todo-images" | parallel -X vipsthumbnail --size "'650x1300>'" --export-profile srgb -o "'__resized__%s.jpeg.webp[Q=75,strip=true]'"; \
          awk '/\.jpg$/' "$work/todo-images" | parallel -X vipsthumbnail --size "'650x1300>'" --export-profile srgb -o "'__resized__%s.jpg.webp[Q=75,strip=true]'"; \
          awk '/\.png$/' "$work/todo-images" | parallel -X vipsthumbnail --size "'650x1300>'" --export-profile srgb -o "'__resized__%s.png[profile=none,strip=true,compression=9]'"; \
          awk '/\.gif$/' "$work/todo-images" | parallel -X vipsthumbnail --size "'650x1300>'" --export-profile srgb -o "'__resized__%s.gif[strip=true]'"; \
          while IFS= read -r f; do \
            out="${f%/*}/__resized__${f##*/}"; \
            case "$f" in *.jpeg|*.jpg) out="$out.webp" ;; esac; \
            mv -f "$out" "$f"; \
          done < "$work/todo-images"; \
        )
      shell: bash

    # Re-encodes each .mp4 to H.264 with its shorter side at most 720 (never enlarged), CRF 26,
    # 8-bit 4:2:0 so phones can decode it in hardware, AAC 96k audio, and the index moved to the
    # front so playback can start while downloading. A video is only replaced if the result is smaller.
    - name: Compress videos
      run: |
        work="$RUNNER_TEMP/protocol-releaser"
        if [ ! -s "$work/todo-videos" ]; then echo "No videos to compress"; exit 0; fi
        while IFS= read -r f; do
          out="$(dirname "$f")/__resized__$(basename "$f")"
          start=$SECONDS
          ffmpeg -nostdin -hide_banner -loglevel error -y -i "$f" \
            -vf "scale='if(gt(iw,ih),-2,trunc(min(720,iw)/2)*2)':'if(gt(iw,ih),trunc(min(720,ih)/2)*2,-2)'" \
            -c:v libx264 -preset veryfast -crf 26 -pix_fmt yuv420p \
            -c:a aac -b:a 96k -movflags +faststart "$out"
          before=$(stat -c%s "$f")
          after=$(stat -c%s "$out")
          if [ "$after" -lt "$before" ]; then mv "$out" "$f"; result=replaced; else rm "$out"; result="kept original (re-encode was not smaller)"; fi
          echo "$f: $((before / 1024)) KB -> $((after / 1024)) KB in $((SECONDS - start))s, $result"
        done < "$work/todo-videos"
      shell: bash

    # Splits the release into media.zip (images, videos and audio) and text.zip (everything else),
    # which together hold the same files as protocol.zip. media.zip also holds media-cache.tsv,
    # mapping each processed file's original content hash to its path, for later releases to reuse.
    - name: Create media and text zips
      run: |
        work="$RUNNER_TEMP/protocol-releaser"
        src=./${{ inputs.src_directory }}
        printf 'settings\t%s\n' "$(cat "$work/settings")" > "$work/media-cache.tsv"
        while IFS=$'\t' read -r hash path; do printf '%s\t./%s\n' "$hash" "${path#"$src"/}"; done < "$work/plan" >> "$work/media-cache.tsv"
        media='.*\.(jpe?g|png|gif|webp|svg|mp4|m4v|mov|webm|mp3|m4a|wav|ogg)$'
        rm -f "$work/media.zip" "$work/text.zip"
        cd "$src"
        find . -type f -regextype posix-extended -regex "$media" > "$work/media-files"
        find . -type f -regextype posix-extended ! -regex "$media" > "$work/text-files"
        zip -q -j "$work/media.zip" "$work/media-cache.tsv"
        if [ -s "$work/media-files" ]; then zip -q "$work/media.zip" -@ < "$work/media-files"; fi
        if [ -s "$work/text-files" ]; then zip -q "$work/text.zip" -@ < "$work/text-files"; fi
        ls -l "$work"/*.zip
      shell: bash

    # For zip -r to do what we want, it is necessary to change directory first
    - name: Create release zip
      run: |
        cd ./${{ inputs.src_directory }}
        zip -r protocol.zip .
      shell: bash

    # protocol.zip MUST be uploaded last, in its own step after every other file. The trails cloud
    # (azure-iac's ProtocolReleasesSync) offers a release to the app as soon as it sees protocol.zip,
    # with the app version it needs read from the manifest.json already attached. A manifest.json
    # that arrived later would leave the release offered, until the next check, to apps too old to
    # run it. action-gh-release uploads a step's files concurrently (Promise.all), so the order needs
    # two steps. A protocol without a manifest.json only gets a warning here.
    - name: Upload release files
      uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631
      with:
        files: |
          ./${{ inputs.src_directory }}/manifest.json
          ${{ runner.temp }}/protocol-releaser/media.zip
          ${{ runner.temp }}/protocol-releaser/text.zip
        tag_name: ${{ inputs.tag_name }}

    # Last, and alone: see the comment on the step above.
    - name: Upload release ZIP
      uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631
      with:
        files: |
          ./${{ inputs.src_directory }}/protocol.zip
        tag_name: ${{ inputs.tag_name }}
